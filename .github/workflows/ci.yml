name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: make all
      - name: Periksa dashboard dari root
        run: python -c 'from streamlit.testing.v1 import AppTest; app = AppTest.from_file("app/dashboard.py").run(timeout=120); assert not app.exception'
